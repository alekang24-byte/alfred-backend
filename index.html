<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfred - Assistente Pessoal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1f1f1f; padding: 15px; text-align: center; border-bottom: 2px solid #3e2723; }
        #chatbox { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 10px; max-width: 80%; }
        .user { align-self: flex-end; background-color: #3e2723; color: white; }
        .bot { align-self: flex-start; background-color: #2c2c2c; color: #ffab00; }
        footer { padding: 20px; background-color: #1f1f1f; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 10px; border: none; background-color: #2c2c2c; color: white; }
        button { padding: 12px 20px; border-radius: 10px; border: none; background-color: #3e2723; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>Alfred</h1>
    </header>
    <div id="chatbox"></div>
    <footer>
        <input type="text" id="userInput" placeholder="O que deseja, patrão?">
        <button onclick="sendMessage()">Enviar</button>
    </footer>

    <script>
        const backendUrl = 'https://alfred-backend-n7oe.onrender.com';

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value;
            if (!message) return;

            appendMessage(message, 'user');
            input.value = '';

            try {
                const response = await fetch(`${backendUrl}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                appendMessage(data.response, 'bot');
            } catch (error) {
                appendMessage('Falha ao conectar ao servidor.', 'bot');
            }
        }

        function appendMessage(text, sender) {
            const chatbox = document.getElementById('chatbox');
            const message = document.createElement('div');
            message.classList.add('message', sender);
            message.innerText = text;
            chatbox.appendChild(message);
            chatbox.scrollTop = chatbox.scrollHeight;
        }
    </script>
</body>
</html>
